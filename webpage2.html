<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;

      background: linear-gradient(
        135deg,
        #ff6b6b,
        #feca57,
        #48dbfb,
        #5f27cd
      );
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Floating background circles */

    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.7;
      animation: float 7s ease-in-out infinite;
    }

    .circle1 {
      width: 180px;
      height: 180px;
      background: #ff4757;
      top: 8%;
      left: 10%;
    }

    .circle2 {
      width: 250px;
      height: 250px;
      background: #1dd1a1;
      bottom: -50px;
      right: 5%;
      animation-delay: 2s;
    }

    .circle3 {
      width: 120px;
      height: 120px;
      background: #feca57;
      top: 15%;
      right: 15%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-30px) rotate(20deg);
      }
    }

    /* Login card */

    .login-container {
      position: relative;
      z-index: 10;
      width: 380px;
      padding: 40px;

      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 25px;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);

      color: white;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(
        135deg,
        #ff6b6b,
        #5f27cd
      );

      border-radius: 20px;
      font-size: 32px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    /* Input fields */

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group span {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
    }

    .input-group input {
      width: 100%;
      padding: 15px 15px 15px 48px;

      border: none;
      outline: none;
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.9);
      color: #333;
      font-size: 14px;

      transition: 0.3s;
    }

    .input-group input:focus {
      transform: scale(1.02);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35);
    }

    /* Options */

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .remember input {
      accent-color: #ff6b6b;
    }

    .options a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .options a:hover {
      text-decoration: underline;
    }

    /* Login button */

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;

      background: linear-gradient(
        135deg,
        #ff4757,
        #5f27cd
      );

      color: white;
      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      transition: 0.3s;

      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .login-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    /* Divider */

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
      font-size: 12px;
      opacity: 0.8;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(255, 255, 255, 0.5);
    }

    /* Social buttons */

    .social-login {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;

      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 12px;

      background: rgba(255,255,255,0.15);
      color: white;

      cursor: pointer;
      font-size: 18px;

      transition: 0.3s;
    }

    .social-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    /* Register */

    .register {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
    }

    .register a {
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    .register a:hover {
      text-decoration: underline;
    }

    /* Mobile */

    @media (max-width: 480px) {
      .login-container {
        width: 90%;
        padding: 30px 25px;
      }

      h1 {
        font-size: 26px;
      }

      .circle1 {
        width: 120px;
        height: 120px;
      }

      .circle2 {
        width: 170px;
        height: 170px;
      }
    }
  </style>
</head>

<body>

  <!-- Background decorations -->
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>

  <!-- Login Card -->
  <div class="login-container">

    <div class="logo">🚀</div>

    <h1>Welcome Back!</h1>
    <p class="subtitle">
      Login to continue your journey
    </p>

    <form id="loginForm">

      <div class="input-group">
        <span>📧</span>
        <input
          type="email"
          placeholder="Email address"
          required
        >
      </div>

      <div class="input-group">
        <span>🔒</span>
        <input
          type="password"
          placeholder="Password"
          required
        >
      </div>

      <div class="options">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot Password?</a>

      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    <div class="divider">
      OR CONTINUE WITH
    </div>

    <div class="social-login">

      <button class="social-btn">🌐</button>
      <button class="social-btn">G</button>
      <button class="social-btn"></button>

    </div>

    <p class="register">
      Don't have an account?
      <a href="#">Create Account</a>
    </p>

  </div>

  <script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const button = document.querySelector(".login-btn");

      button.textContent = "Logging in...";

      setTimeout(() => {
        button.textContent = "✓ Login Successful";

        setTimeout(() => {
          button.textContent = "Login";
        }, 2000);

      }, 1000);
    });
  </script>

</body>
</html>
